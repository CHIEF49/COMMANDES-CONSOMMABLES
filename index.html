<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commande consommables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --header-bg: #1C1B36;
    --header-ink: #E8E8F6;
    --header-ink-dim: #A6A5CC;
    --ink: #1E1E1E;
    --ink-dim: #6B6B6B;
    --line: #DADADA;
    --service: #3C6E52;
    --service-bg: #DCE6DA;
    --panne: #B5650B;
    --panne-bg: #F5E3C8;
    --maint: #96790A;
    --maint-bg: #F6EFBE;
    --accent: #8A8A8A;
    --stamp: #8A8A8A;
    --danger: #A8342A;
    --danger-bg: #F3D9D3;
    --focus: #1E1E1E;
    --radius: 0px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
  }

  .ruler {
    height: 2px;
    width: 100%;
    background-color: var(--accent);
  }

  header {
    padding: 20px 18px 18px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .stamp {
    flex: none;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--line);
    margin-top: 2px;
  }
  .stamp img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .header-text { flex: 1; min-width: 0; }
  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.1;
    color: var(--header-ink);
  }
  .subtitle {
    color: var(--header-ink-dim);
    font-size: 13.5px;
    margin: 6px 0 0;
    max-width: 46ch;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    padding: 14px 18px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  .search {
    flex: 1 1 140px;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 11px;
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
  }
  .search:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .add-btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    padding: 9px 14px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Space Grotesk', sans-serif;
  }
  .add-btn:hover { opacity: 0.88; }
  .add-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .export-btn {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 14px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Space Grotesk', sans-serif;
  }
  .export-btn:hover { background: var(--bg); }
  .export-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .section-switch {
    display: flex;
    gap: 8px;
    padding: 16px 18px 0;
  }
  .sec-btn {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .sec-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  .sec-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .tabs {
    display: flex;
    gap: 2px;
    padding: 0 18px;
    overflow-x: auto;
    background: color-mix(in srgb, var(--accent) 12%, var(--panel));
    border-bottom: 1px solid var(--line);
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 10px 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .tab .count { opacity: 0.7; }

  main {
    padding: 14px 18px 90px;
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
    align-items: start;
  }

  .row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--panel);
  }
  .row-main { flex: 1; min-width: 0; }
  .row-name {
    font-weight: 600;
    font-size: 15.5px;
    overflow-wrap: anywhere;
  }
  .row-note {
    color: var(--ink-dim);
    font-size: 12.5px;
    margin-top: 4px;
    padding: 6px 8px;
    background: color-mix(in srgb, var(--line) 35%, var(--panel));
    border-radius: 4px;
    overflow-wrap: anywhere;
  }
  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 4px;
    display: inline-block;
    margin-top: 5px;
  }
  .chip.service { color: var(--service); background: var(--service-bg); }
  .chip.panne { color: var(--panne); background: var(--panne-bg); }
  .chip.maintenance { color: var(--maint); background: var(--maint-bg); }
  .chip.hs { color: var(--danger); background: var(--danger-bg); }
  .chip.loan { color: var(--ink); background: color-mix(in srgb, var(--accent) 25%, var(--panel)); }
  .chip.neutral { color: var(--ink-dim); background: var(--panel); border: 1px solid var(--line); }
  .chip.warn { color: var(--danger); background: var(--danger-bg); }

  .row-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .row-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }

  .qty {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
  }
  .qty button {
    width: 26px; height: 26px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    font-family: 'JetBrains Mono', monospace;
  }
  .qty button:disabled { opacity: 0.35; cursor: default; }
  .qty button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .qty-val { min-width: 20px; text-align: center; font-size: 14px; font-weight: 700; }

  .row-actions {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .icon-btn.pdf {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 5px 7px;
  }
  .icon-btn {
    background: none;
    border: none;
    color: var(--ink-dim);
    cursor: pointer;
    padding: 5px;
    font-size: 15px;
    border-radius: var(--radius);
  }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-dim);
  }
  .empty p { font-size: 14px; max-width: 32ch; margin: 6px auto 18px; }
  .empty .add-btn { margin: 0 auto; }

  .app-footer {
    border-top: 1px solid var(--line);
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    text-align: center;
    color: var(--ink-dim);
    font-size: 11.5px;
    font-family: 'JetBrains Mono', monospace;
  }

  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.42);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 20;
  }
  .sheet {
    background: var(--panel);
    width: 100%;
    max-width: 480px;
    border-radius: 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    max-height: 88vh;
    overflow-y: auto;
  }
  .sheet h2 { font-size: 17px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin-bottom: 5px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 10px;
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14.5px;
  }
  .field textarea { resize: vertical; min-height: 50px; }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--focus); outline-offset: 1px;
  }
  .status-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-opt {
    flex: 1 1 30%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-dim);
    border-radius: var(--radius);
    padding: 9px 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    cursor: pointer;
    text-align: center;
  }
  .status-opt.sel.service { border-color: var(--service); color: var(--service); background: var(--service-bg); }
  .status-opt.sel.panne { border-color: var(--panne); color: var(--panne); background: var(--panne-bg); }
  .status-opt.sel.maintenance { border-color: var(--maint); color: var(--maint); background: var(--maint-bg); }
  .status-opt.sel.hs { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
  .status-opt.sel.loan { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 25%, var(--panel)); }
  .status-opt.sel.neutral { border-color: var(--ink-dim); color: var(--ink-dim); background: var(--panel); }
  .status-opt:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .sheet-actions { display: flex; gap: 8px; margin-top: 18px; }
  .btn-primary, .btn-secondary, .btn-danger {
    flex: 1;
    padding: 11px;
    border-radius: var(--radius);
    border: none;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
  }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-secondary { background: none; border: 1px solid var(--line); color: var(--ink); }
  .btn-danger { background: none; border: 1px solid var(--panne); color: var(--panne); flex: 0 0 auto; padding: 11px 16px; }
  .btn-primary:focus-visible, .btn-secondary:focus-visible, .btn-danger:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  .status-banner {
    margin: 14px 18px 0;
    padding: 10px 12px;
    background: var(--maint-bg);
    color: var(--maint);
    border-radius: var(--radius);
    font-size: 13px;
  }

  .skeleton {
    grid-column: 1 / -1;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .skeleton .bar {
    height: 13px;
    width: 40%;
    background: var(--panel);
    border-radius: var(--radius);
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---- Thème façon site de référence ---- */
  :root{--bg:#E9E9EC;--panel:#FFFFFF;--line:#D8D8DE;--ink:#33345B;--ink-dim:#6C6C80;--accent:#74CAF1;--stamp:#74CAF1;--focus:#33345B;--header-bg:#33345B;--header-ink:#FFFFFF;--header-ink-dim:#C9CAE3;--radius:10px}
  .ruler{display:none}
  .top-actions{display:flex;gap:8px;justify-content:flex-end;padding:10px 18px;background:var(--bg)}
  header{border-bottom:none}
  .stamp{border:2px solid var(--accent)}
  .page-title{font-size:24px;font-weight:700;color:var(--ink);margin:0;padding:20px 18px 2px}
  .section-switch{background:var(--header-bg);padding:0 18px 16px}
  .sec-btn{background:transparent;border:1px solid #55567F;color:#C9CAE3;border-radius:10px;font-weight:600}
  .sec-btn.active{background:#3E4A74;border-color:var(--accent);color:var(--accent)}
  .toolbar{background:var(--bg);border-bottom:none;padding:12px 18px}
  .search{border-radius:12px;flex:0 1 260px;padding:6px 11px;font-size:13px}
  .add-btn{background:var(--ink);color:#fff;border-radius:10px}
  .export-btn{background:#F4F4F6;color:var(--ink-dim);border:1px solid var(--line);border-radius:10px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:4px 18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer}
  .stat.static{cursor:default}
  .stat-num{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;color:var(--ink);line-height:1.1}
  .stat-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px}
  .tabs{background:#F3F3F5;border:1px solid var(--line);border-radius:14px;margin:12px 18px 0;padding:6px;gap:4px}
  .tab{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:500;color:#3A3A4A;border:none;border-radius:10px;padding:9px 12px}
  .tab.active{background:var(--ink);color:#fff;font-weight:600}
  .tab .count{display:inline-block;background:#DEDEE4;border-radius:8px;padding:1px 7px;margin-left:6px;font-size:12px;opacity:1}
  .tab.active .count{background:rgba(255,255,255,.22)}
  .row{border-radius:14px}
  main{padding:14px 18px 40px}
  @media (min-width:820px){
    html{background:var(--bg)}
    body{display:grid;grid-template-columns:250px 1fr;grid-auto-rows:min-content;min-height:100vh;background:linear-gradient(to right,var(--header-bg) 250px,var(--bg) 250px) no-repeat}
    header{grid-column:1;grid-row:1 / span 3;flex-direction:column;align-items:flex-start;padding:26px 20px 12px;background:transparent}
    .subtitle{display:none}
    .header-text::after{content:'COMMANDES';display:block;margin-top:8px;font:500 12px 'JetBrains Mono',monospace;letter-spacing:.18em;color:var(--accent)}
    .section-switch{grid-column:1;grid-row:4 / span 30;flex-direction:column;gap:2px;padding:28px 0 0;background:transparent}
    .section-switch::before{content:'INVENTAIRE';font:500 12px 'JetBrains Mono',monospace;letter-spacing:.18em;color:#8F90B8;padding:0 20px 12px}
    .sec-btn{flex:none;text-align:left;border:none;border-left:4px solid transparent;border-radius:0;padding:14px 20px;font-size:16px}
    .sec-btn.active{background:#3E4A74;border-left-color:var(--accent)}
    #banner-slot,.top-actions,.page-title,.toolbar,.stats,#tabs,#piece-tabs,main,.app-footer{grid-column:2}
  }
  .next{margin-right:auto}
  .icon-btn.del{color:#942c24}
  .icon-btn.del.arm{background:#942c24;color:#fff;width:auto;padding:0 10px}
  .grp{grid-column:1/-1;margin:14px 0 0;font:600 13px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);border-bottom:1px solid var(--line);padding-bottom:6px}
</style>
</head>
<body>
<div class="top-actions" style="flex-wrap:wrap">
  <button class="export-btn" id="open-cat">Ajouter depuis le catalogue</button>
  <button class="export-btn" id="export-pdf">PDF liste</button>
  <button class="add-btn" id="open-add">+ Ajouter au catalogue</button>
</div>

  const FAM_ORDER = ['ELITECH', 'SKYLA', 'BIONOTE', 'TOSOH', 'EDIF', 'NIHON KOHDEN', 'URIT', 'Autres'];
  const famOf = i => FAM[i.device] || 'Autres';
  const TABS = [['catalogue', 'Catalogue'], ['a_commander', 'À commander'], ['commande', 'Commandé']];

  let db = null, dl = null, canWrite = null, items = [], loaded = false, filter = 'a_commander', term = '', devF = 'all';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const banner = t => { $('banner-slot').innerHTML = t ? '<div class="status-banner">' + esc(t) + '</div>' : ''; };
  const ro = () => (canWrite === false ? 'disabled' : '');

  function count(k) {
    if (k === 'all') return items.filter(i => i.status !== 'catalogue').length;
    if (k === 'urgent') return items.filter(i => i.urgent && i.status !== 'recu').length;
    return items.filter(i => i.status === k).length;
  }
  function visible() {
    if (filter === 'a_commander' || filter === 'commande') return items.filter(i => i.status === filter);
    const t = term.trim().toLowerCase();
    let l = items.filter(i => filter === 'all' ? (i.status !== 'catalogue' || !!t) : (filter === 'urgent' ? i.urgent && i.status !== 'recu' : i.status === filter));
    if (t) l = l.filter(i => [i.name, i.reference, i.device].some(v => (v || '').toLowerCase().includes(t)));
    if (devF !== 'all') l = l.filter(i => (i.device || '') === devF);
    return l;
  }

  function render() {
    document.querySelector('.toolbar').style.display = filter !== 'catalogue' ? 'none' : '';
    $('stats').innerHTML = TABS.map(([k, l]) =>
      '<div class="stat" data-f="' + k + '"><div class="stat-num">' + count(k) + '</div><div class="stat-label">' + l + '</div></div>').join('');
    $('tabs').innerHTML = TABS.map(([k, l]) =>
      '<button class="tab' + (k === filter ? ' active' : '') + '" data-f="' + k + '">' + l + ' <span class="count">' + count(k) + '</span></button>').join('');
    if (!loaded) return;
    const l = visible().sort((a, b) => FAM_ORDER.indexOf(famOf(a)) - FAM_ORDER.indexOf(famOf(b)) || devRank(a.device) - devRank(b.device) || (a.name || '').localeCompare(b.name || '')), el = $('list');
    if (!l.length) {
      el.innerHTML = '<div class="empty"><p>' + 'Rien à afficher ici pour le moment. Ajoutez des consommables depuis l’onglet Catalogue.' + '</p>' +
        (items.length ? '' : '<button class="add-btn" id="empty-add">+ Ajouter un consommable</button>') + '</div>';
      const b = $('empty-add'); if (b) b.addEventListener('click', () => sheet());
      return;
    }
    let last = null;
    el.innerHTML = l.map(i => {
      const st = STATUS[i.status] || STATUS.a_commander;
      const d = famOf(i);
      const h = d !== last ? '<h3 class="grp">' + esc(d) + '</h3>' : '';
      last = d;
      return h + '<div class="row" data-id="' + i.id + '"><div class="row-main">' +
        '<div class="row-name">' + esc(i.name) + '</div>' +
        (i.reference ? '<div class="row-meta">Réf. ' + esc(i.reference) + '</div>' : '') +
        (i.device ? '<div class="row-meta">Appareil ' + esc(i.device) + '</div>' : '') +
        (i.note ? '<div class="row-note">' + esc(i.note) + '</div>' : '') +
        '<div class="row-chips"><span class="chip ' + st.cls + '">' + st.label + '</span>' + (i.urgent ? '<span class="chip hs">Urgent</span>' : '') + '</div>' +
        '<div class="qty"><button class="dec" aria-label="Diminuer" ' + ro() + '>−</button><span class="qty-val">' + (i.quantity || 1) + '</span><button class="inc" aria-label="Augmenter" ' + ro() + '>+</button></div>' +
        '</div><div class="row-actions">' +
        (NEXT[i.status] ? '<button class="icon-btn pdf next" ' + ro() + '>' + NEXT_LABEL[i.status] + '</button>' : '') +
        '<button class="icon-btn edit" aria-label="Modifier" ' + ro() + '>✎</button><button class="icon-btn del" aria-label="Supprimer" ' + ro() + '>✕</button></div></div>';
    }).join('');
    el.querySelectorAll('.row').forEach(r => {
      const i = items.find(x => x.id === r.getAttribute('data-id'));
      if (!i) return;
      r.querySelector('.edit').addEventListener('click', () => sheet(i));
      const xb = r.querySelector('.del');
      xb.addEventListener('click', async () => {
        if (!xb.classList.contains('arm')) {
          xb.classList.add('arm'); xb.textContent = 'Confirmer ?';
          setTimeout(() => { xb.classList.remove('arm'); xb.textContent = '✕'; }, 3000);
          return;
        }
        if (!db) return;
        try { await db.collection('commandes').doc(i.id).delete(); }
        catch (e) { banner('La suppression a échoué. Réessayez.'); }
      });
      r.querySelector('.inc').addEventListener('click', () => upd(i, { quantity: (i.quantity || 1) + 1 }));
      r.querySelector('.dec').addEventListener('click', () => upd(i, { quantity: Math.max(1, (i.quantity || 1) - 1) }));
      const n = r.querySelector('.next'); if (n) n.addEventListener('click', () => upd(i, { status: NEXT[i.status] }));
    });
  }

  async function upd(i, data) {
    if (!db || canWrite === false) return;
    Object.assign(i, data); render();
    try { await db.collection('commandes').doc(i.id).update(data); }
    catch (e) { banner('La modification n’a pas pu être enregistrée. Réessayez.'); }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('.tab[data-f], .stat[data-f]');
    if (t) { filter = t.getAttribute('data-f'); render(); }
  });
  $('search').addEventListener('input', e => { term = e.target.value; render(); });
  $('dev-filter').innerHTML = '<option value="all">Tous les appareils</option>' + DEVICES.map(d => '<option>' + esc(d) + '</option>').join('');
  $('dev-filter').addEventListener('change', e => { devF = e.target.value; render(); });
  $('open-add').addEventListener('click', () => sheet());
  $('export-pdf').addEventListener('click', pdf);
  $('open-cat').addEventListener('click', catalogue);

  function sheet(it) {
    let st = it ? it.status || 'catalogue' : 'catalogue', urg = !!(it && it.urgent);
    const b = document.createElement('div'); b.className = 'sheet-backdrop';
    const fld = (l, id, h) => '<div class="field"><label for="' + id + '">' + l + '</label>' + h + '</div>';
    b.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><h2>' + (it ? 'Modifier le consommable' : 'Ajouter au catalogue') + '</h2>' +
      fld('Nom du consommable', 'f-name', '<input id="f-name" type="text" value="' + esc(it ? it.name : '') + '" placeholder="Ex. Réactif, rouleau de papier…">') +
      fld('Appareil (facultatif)', 'f-dev', '<select id="f-dev"><option value="">—</option>' + DEVICES.map(d => '<option' + (it && it.device === d ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '</select>') +
      fld('Référence (facultatif)', 'f-ref', '<input id="f-ref" type="text" value="' + esc(it && it.reference || '') + '" placeholder="Ex. REF-1234">') +
      fld('Quantité à commander', 'f-qty', '<input id="f-qty" type="number" min="1" value="' + (it ? it.quantity || 1 : 1) + '">') +
      '<div class="field"><label>Statut</label><div class="status-picker" id="st-pick">' +
      ['catalogue', 'a_commander', 'commande'].map(k => '<button type="button" class="status-opt' + (k === st ? ' sel ' + STATUS[k].cls : '') + '" data-s="' + k + '">' + STATUS[k].label + '</button>').join('') +
      '<button type="button" class="status-opt' + (urg ? ' sel hs' : '') + '" id="urg">Urgent</button></div></div>' +
      fld('Note (facultatif)', 'f-note', '<textarea id="f-note" placeholder="Remarque…">' + esc(it && it.note || '') + '</textarea>') +
      '<div class="sheet-actions">' + (it ? '<button class="btn-danger" id="del">Supprimer</button>' : '') +
      '<button class="btn-secondary" id="cancel">Annuler</button><button class="btn-primary" id="save">' + (it ? 'Enregistrer' : 'Ajouter') + '</button></div></div>';
    document.body.appendChild(b);
    const close = () => b.remove(), q = s => b.querySelector(s);
    b.addEventListener('click', e => { if (e.target === b) close(); });
    q('#cancel').addEventListener('click', close);
    q('#st-pick').addEventListener('click', e => {
      const o = e.target.closest('.status-opt'); if (!o) return;
      if (o.id === 'urg') { urg = !urg; o.classList.toggle('sel', urg); o.classList.toggle('hs', urg); return; }
      st = o.getAttribute('data-s');
      b.querySelectorAll('#st-pick .status-opt[data-s]').forEach(x => x.classList.remove('sel', 'panne', 'loan', 'service', 'neutral'));
      o.classList.add('sel', STATUS[st].cls);
    });
    const d = q('#del');
    if (d) d.addEventListener('click', async () => {
      if (!db) return; d.disabled = true;
      try { await db.collection('commandes').doc(it.id).delete(); close(); }
      catch (e) { d.disabled = false; banner('La suppression a échoué. Réessayez.'); }
    });
    q('#save').addEventListener('click', async () => {
      const name = q('#f-name').value.trim();
      if (!name) { q('#f-name').focus(); return; }
      const data = { name, device: q('#f-dev').value, reference: q('#f-ref').value.trim(), quantity: Math.max(1, parseInt(q('#f-qty').value, 10) || 1), status: st, urgent: urg, note: q('#f-note').value.trim() };
      const s = q('#save'); s.disabled = true; s.textContent = 'Enregistrement…';
      try {
        if (!db) throw new Error('no db');
        if (it) await db.collection('commandes').doc(it.id).update(data); else await db.collection('commandes').add(data);
        close();
      } catch (e) { s.disabled = false; s.textContent = it ? 'Enregistrer' : 'Ajouter'; banner('L’enregistrement a échoué. Réessayez.'); }
    });
    setTimeout(() => q('#f-name').focus(), 50);
  }

  function catalogue() {
    const b = document.createElement('div'); b.className = 'sheet-backdrop';
    b.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><h2>Catalogue</h2><div class="field"><input id="c-q" type="text" placeholder="Rechercher dans le catalogue…"></div><div id="c-list"></div><div class="sheet-actions"><button class="btn-secondary" id="c-close">Fermer</button></div></div>';
    document.body.appendChild(b);
    const q = s => b.querySelector(s);
    b.addEventListener('click', e => { if (e.target === b) b.remove(); });
    q('#c-close').addEventListener('click', () => b.remove());
    function draw() {
      const t = q('#c-q').value.trim().toLowerCase();
      const l = items.filter(i => i.status === 'catalogue' || i.status === 'recu')
        .filter(i => !t || [i.name, i.reference, i.device].some(v => (v || '').toLowerCase().includes(t)))
        .sort((a, c) => devRank(a.device) - devRank(c.device) || (a.name || '').localeCompare(c.name || ''));
      let last = null;
      q('#c-list').innerHTML = l.length ? l.map(i => {
        const d = i.device || 'Sans appareil';
        const h = d !== last ? '<h3 class="grp">' + esc(d) + '</h3>' : '';
        last = d;
        return h + '<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:0"><div class="row-name" style="font-size:14px">' + esc(i.name) + '</div><div class="row-meta">' + esc(i.reference || '') + '</div></div><button class="icon-btn pdf" data-add="' + i.id + '" ' + ro() + '>Ajouter</button></div>';
      }).join('') : '<p class="row-meta">Aucun consommable dans le catalogue.</p>';
      q('#c-list').querySelectorAll('[data-add]').forEach(btn => btn.addEventListener('click', async () => {
        const i = items.find(x => x.id === btn.getAttribute('data-add'));
        if (i) { await upd(i, { status: 'a_commander' }); draw(); }
      }));
    }
    q('#c-q').addEventListener('input', draw);
    draw();
  }

  async function pdf() {
    if (!window.jspdf || !dl) { banner('Le PDF n’est pas disponible dans cette vue.'); return; }
    const l = visible().slice().sort((a, b) => FAM_ORDER.indexOf(famOf(a)) - FAM_ORDER.indexOf(famOf(b)) || devRank(a.device) - devRank(b.device) || (a.name || '').localeCompare(b.name || ''));
    if (!l.length) { banner('Rien à exporter avec ce filtre.'); return; }
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const P = [49, 48, 89], W = 210, H = 297, label = (TABS.find(t => t[0] === filter) || TABS[0])[1];
    const fit = (t, w) => { t = String(t || ''); while (t.length > 1 && doc.getTextWidth(t) > w) t = t.slice(0, -1); return t; };
    doc.setFillColor(...P); doc.rect(0, 0, W, 30, 'F');
    try { doc.addImage(LOGO, 'PNG', 14, 6, 18, 18); } catch (e) {}
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
    doc.text('Liste de commande — consommables', 38, 15);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(label + ' · ' + l.length + ' ligne(s) · ' + new Date().toLocaleDateString('fr-FR'), 38, 22);
    let y = 40;
    const head = () => {
      doc.setFillColor(232, 244, 251); doc.rect(14, y - 5.5, W - 28, 8, 'F');
      doc.setTextColor(...P); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
      [['Consommable', 16], ['Référence', 80], ['Appareil', 122], ['Qté', 148], ['Statut', 160]].forEach(([t, x]) => doc.text(t, x, y));
      y += 9;
    };
    head();
    let lastFam = null;
    l.forEach((i, n) => {
      const fam = famOf(i);
      if (fam !== lastFam) {
        if (y > H - 40) { doc.addPage(); y = 20; head(); }
        y += 3;
        doc.setFillColor(...P); doc.rect(14, y - 5.5, W - 28, 8, 'F');
        doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
        const devs = [...new Set(l.filter(x => famOf(x) === fam).map(x => x.device || 'Sans appareil'))].join(' / ');
        doc.text(fit(fam + '  —  ' + devs, W - 32), 16, y);
        y += 10; lastFam = fam;
      }
      if (y > H - 22) { doc.addPage(); y = 20; head(); }
      doc.setFont('helvetica', i.urgent ? 'bold' : 'normal'); doc.setFontSize(10);
      const nl = doc.splitTextToSize((i.urgent ? '! ' : '') + i.name, 62).slice(0, 2), rh = nl.length > 1 ? 12 : 8;
      if (n % 2) { doc.setFillColor(247, 247, 250); doc.rect(14, y - 5.2, W - 28, rh, 'F'); }
      doc.setFontSize(10);
      doc.setFont('helvetica', i.urgent ? 'bold' : 'normal');
      doc.setTextColor(...(i.urgent ? [148, 44, 36] : [30, 30, 30]));
      doc.text(nl, 16, y);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 30, 30);
      { let fs = 10; const r = i.reference || '-'; doc.setFontSize(fs); while (fs > 5 && doc.getTextWidth(r) > 40) { fs -= 0.5; doc.setFontSize(fs); } doc.text(r, 80, y); doc.setFontSize(10); }
      doc.text(fit(i.device || '-', 24), 122, y);
      doc.setFont('helvetica', 'bold'); doc.text(String(i.quantity || 1), 148, y);
      doc.setFont('helvetica', 'normal'); doc.text((STATUS[i.status] || STATUS.a_commander).label, 160, y);
      y += rh;
    });
    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p); doc.setDrawColor(215, 218, 232); doc.line(14, H - 14, W - 14, H - 14);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(111, 111, 148);
      doc.text('Atelier Fabien — commandes de consommables', 14, H - 9);
      doc.text('Page ' + p + '/' + pages, W - 14, H - 9, { align: 'right' });
    }
    try { await dl.save({ filename: 'commande_consommables_' + new Date().toISOString().slice(0, 10) + '.pdf', data: doc.output('blob') }); }
    catch (e) { if (!e || e.code !== 'declined') banner('Le PDF n’a pas pu être téléchargé.'); }
  }

  async function boot() {
    for (let k = 0; k < 30 && !(window.claude && typeof window.claude.use === 'function'); k++) await new Promise(r => setTimeout(r, 100));
    const use = n => (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null);
    dl = await use('downloads');
    db = await use('db');
    if (!db) {
      loaded = true;
      banner('Le registre partagé n’est pas disponible dans cette vue. Ouvrez l’application publiée pour voir et modifier la liste de l’équipe.');
      render(); return;
    }
    try { const u = await use('user'); if (u) canWrite = await u.can('data.write'); } catch (e) { canWrite = null; }
    if (canWrite === false) banner('Vous êtes en lecture seule sur cette liste.');
    const tmo = setTimeout(() => { if (!loaded) { loaded = true; banner('La liste met du temps à charger. Vérifiez votre connexion.'); render(); } }, 10000);
    try {
      db.collection('commandes').orderBy('name').onSnapshot(
        s => { clearTimeout(tmo); banner(canWrite === false ? 'Vous êtes en lecture seule sur cette liste.' : ''); items = s.docs.map(d => ({ id: d.id, ...d.data() })); loaded = true; render(); },
        () => { clearTimeout(tmo); loaded = true; banner('La connexion à la liste a été interrompue. Rechargez la page.'); render(); });
    } catch (e) { loaded = true; banner('Impossible de charger la liste.'); render(); }
  }
  render();
  boot();
})();
</script>
</body>
</html>
