<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande consommables</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Couleurs KITVIA — identiques au projet GESTION-STOCK */
  :root {
    --bg: #ffffff; --panel: #ffffff; --ink: #1f1f33; --muted: #6c6b85; --line: #e2e1ea;
    --navy: #33325a; --sky: #76cbf4; --sky-soft: #dcf1fb;
    --accent: #33325a; --on-accent: #ffffff; --accent-soft: #dcf1fb;
    --ok: #2b8a3e; --ok-soft: #e6f4ea; --bad: #c92a2a; --bad-soft: #fdecec; --grey-soft: #efeff4;
    --radius: 14px; --radius-control: 8px; --radius-field: 7px; --radius-modal: 14px; --radius-badge: 5px; --radius-pill: 20px;
    --shadow: 0 1px 2px rgba(51,50,90,.06), 0 6px 20px rgba(51,50,90,.06);
    --shadow-modal: 0 20px 60px rgba(31,31,51,.3);
    --font-sans: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16162a; --panel: #212140; --ink: #ecebf5; --muted: #a3a2c0; --line: #33335a;
      --accent: #76cbf4; --accent-soft: #1e3550; --sky-soft: #1e3550;
      --ok: #51cf66; --ok-soft: #1b3022; --bad: #ff6b6b; --bad-soft: #3d1d1d; --grey-soft: #2a2a4a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-sans); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: var(--font-mono); font-size: 13px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 18px 40px; display: flex; flex-direction: column; gap: 18px; }
  .topbar { background: var(--navy); box-shadow: 0 2px 10px rgba(51,50,90,.12); color: #fff; }
  .topbar .in { padding: 0 22px 0 0; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .topbar .logo-box { background: #fff; padding: 10px 46px 10px 18px; clip-path: polygon(0 0, 100% 0, calc(100% - 28px) 100%, 0 100%); }
  .topbar .logo-box img { height: 58px; width: auto; display: block; }
  .topbar h1 { color: #fff; font-size: 17px; font-weight: 600; }
  .topbar .sub { color: #b9b8d6; }
  .topbar .status-line { color: #d6d5ea; }
  .topbar .btn { background: transparent; border-color: rgba(255,255,255,.35); color: #fff; }
  .topbar .btn:hover { border-color: #fff; }
  @media (max-width: 640px) { .topbar .logo-box img { height: 42px; } .topbar .logo-box { padding: 8px 34px 8px 12px; } .topbar .in { gap: 12px; padding-bottom: 10px; } .topbar h1 { font-size: 14px; } }
  .logo { width: 38px; height: 38px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); flex: none; }
  .head-text { flex: 1; min-width: 200px; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .status-line { font-size: 12.5px; color: var(--muted); }

  .btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 13px; border-radius: var(--radius-control); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn:focus-visible, .chip:focus-visible, .urg:focus-visible, .qty button:focus-visible, .rowbtn:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  .btn.primary { background: #33325a; border-color: #33325a; color: #fff; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .btn.primary { border-color: var(--sky); } }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--bad); }
  .btn.danger.arm { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.sm { padding: 5px 9px; font-size: 13px; }
  .btn.added { background: var(--ok-soft); border-color: var(--ok-soft); color: var(--ok); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .rowbtn { background: none; border: 0; cursor: pointer; color: var(--muted); border-radius: 6px; width: 30px; height: 30px; display: inline-grid; place-items: center; flex: none; }
  .rowbtn:hover { background: var(--grey-soft); color: var(--ink); }
  .rowbtn:disabled { opacity: .4; cursor: not-allowed; }

  .cols { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .cat { flex: 999 1 560px; min-width: 0; }
  .cmd { flex: 1 1 360px; min-width: 0; position: sticky; top: 14px; }
  @media (max-width: 960px) { .cmd { position: static; } }
  .card-head { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .count { font-size: 12.5px; color: var(--muted); }

  .search { position: relative; display: block; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--panel); }
  .search input:focus { outline: 2px solid var(--sky); outline-offset: 1px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-pill); padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip:hover { border-color: var(--sky); }
  @media (prefers-color-scheme: dark) { .chip.on { background: var(--sky); color: #16162a; border-color: var(--sky); } }

  .grp { margin: 0; padding: 10px 14px 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--line); background: color-mix(in srgb, var(--sky-soft) 45%, var(--panel)); }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); }
  .grp + .item { border-top: 0; }
  .item-main { flex: 1; min-width: 0; }
  .item-name { font-weight: 500; overflow-wrap: anywhere; }
  .item-ref { color: var(--muted); }
  .item-note { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .dev { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-badge); background: var(--sky-soft); color: var(--ink); white-space: nowrap; }
  .catlist { max-height: calc(100vh - 290px); min-height: 320px; overflow-y: auto; }
  @media (max-width: 960px) { .catlist { max-height: none; } }

  .cmd .item-name { font-size: 14px; }
  .cmd .item-ref { font-size: 12px; }
  .urg { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-pill); padding: 2px 9px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .urg.on { background: var(--bad-soft); border-color: var(--bad-soft); color: var(--bad); }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius-control); overflow: hidden; flex: none; }
  .qty button { border: 0; background: none; width: 28px; height: 28px; cursor: pointer; font-size: 16px; color: var(--muted); }
  .qty button:hover { background: var(--grey-soft); color: var(--ink); }
  .qty span { min-width: 30px; text-align: center; font-weight: 700; font-size: 14px; }
  .cmd-foot { padding: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--bg) 40%, var(--panel)); }
  .cmd-foot .btn { width: 100%; }
  .cmd-foot .btn.primary { padding: 11px 13px; }
  .empty { padding: 32px 18px; text-align: center; color: var(--muted); font-size: 14px; }

  .banner { padding: 10px 12px; border-radius: var(--radius-control); background: var(--bad-soft); color: var(--bad); font-size: 13.5px; font-weight: 500; }
  .skeleton { padding: 14px; color: var(--muted); font-size: 13px; }

  .overlay { position: fixed; inset: 0; background: rgba(31,31,51,.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 14px; z-index: 20; overflow: auto; }
  .overlay.login { background: var(--navy); align-items: center; z-index: 50; }
  .modal { background: var(--panel); border-radius: var(--radius-modal); width: 100%; max-width: 480px; padding: 20px; box-shadow: var(--shadow-modal); border: 1px solid var(--line); }
  .modal h2 { margin: 0 0 14px; }
  .fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .fld label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .fld input, .fld select, .fld textarea { min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-field); background: var(--bg); }
  .fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid var(--sky); outline-offset: 1px; }
  .fld textarea { min-height: 64px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mfoot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; align-items: center; }
  .mfoot .left { margin-right: auto; }
  .err { color: var(--bad); font-size: 12.5px; min-height: 1em; margin: 0 0 6px; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--radius-control); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; max-width: 90vw; }
  .toast.on { opacity: 1; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } .item .dev { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="in">
    <div class="logo-box"><img src="logo.png" alt="KITVIA"></div>
    <div class="head-text">
      <h1>Commande consommables</h1>
      <div class="sub">Choisissez dans le catalogue, la commande se remplit à droite</div>
    </div>
    <span class="status-line" id="status">Connexion…</span>
    <button class="btn sm" type="button" id="new-piece">+ Nouvelle pièce</button>
    <button class="btn sm" type="button" id="logout" hidden>Se déconnecter</button>
  </div>
</div>
<div class="wrap">
  <div id="banner" role="alert"></div>

  <div class="cols">
    <section class="card cat" aria-labelledby="cat-title">
      <div class="card-head">
        <div class="title-row"><h2 id="cat-title">Catalogue</h2><span class="count" id="cat-count"></span></div>
        <label class="search">
          <span class="sr">Rechercher dans le catalogue</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="Désignation, référence ou appareil…" autocomplete="off">
        </label>
        <div class="chips" id="chips" role="group" aria-label="Filtrer par fabricant"></div>
      </div>
      <div class="catlist" id="cat-list"><div class="skeleton">Chargement du catalogue…</div></div>
    </section>

    <aside class="card cmd" aria-labelledby="cmd-title">
      <div class="card-head" style="border-bottom: 1px solid var(--line)">
        <div class="title-row"><h2 id="cmd-title">Commande en cours</h2><span class="count" id="cmd-count"></span></div>
      </div>
      <div id="cmd-list"></div>
      <div class="cmd-foot">
        <button class="btn primary" type="button" id="pdf">Télécharger le bon de commande (PDF)</button>
        <button class="btn danger" type="button" id="clear">Vider la commande</button>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="firebase-config.js"></script>

  const DEVICES = ['PROVET', 'KHEMA4', 'AiA 360', 'KHEMA 6', 'KBIO 4', 'KBIO 5', 'KBIO 6', 'KBIO 7', 'KIMMUNO', 'M10', 'ABACUS', 'COAGPOC', 'EPOC', 'HEMOVET', 'I-SMART', 'URIREADER', 'Autres'];
  const FAM = { 'AiA 360': 'TOSOH', 'KBIO 4': 'EDIF', 'KBIO 6': 'EDIF', 'KHEMA4': 'NIHON KOHDEN', 'PROVET': 'ELITECH', 'KBIO 5': 'SKYLA', 'KBIO 7': 'SKYLA', 'KIMMUNO': 'BIONOTE', 'M10': 'BIONOTE', 'KHEMA 6': 'URIT' };
  const FAM_ORDER = ['ELITECH', 'SKYLA', 'BIONOTE', 'TOSOH', 'EDIF', 'NIHON KOHDEN', 'URIT', 'Autres'];
  const FAM_LABEL = { 'ELITECH': 'Elitech', 'SKYLA': 'Skyla', 'BIONOTE': 'Bionote', 'TOSOH': 'Tosoh', 'EDIF': 'Edif', 'NIHON KOHDEN': 'Nihon Kohden', 'URIT': 'Urit', 'Autres': 'Autres' };
  const famOf = i => FAM[i.device] || 'Autres';
  const devRank = d => { const k = DEVICES.indexOf(d || ''); return k < 0 ? 999 : k; };
  const byFam = (a, b) => FAM_ORDER.indexOf(famOf(a)) - FAM_ORDER.indexOf(famOf(b)) || devRank(a.device) - devRank(b.device) || (a.name || '').localeCompare(b.name || '', 'fr');
  const inCmd = i => i.status === 'a_commander';

  let db = null, dl = null, canWrite = null, items = [], loaded = false, term = '', fam = 'all';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ro = () => (canWrite === false || !db ? 'disabled' : '');
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const banner = t => { $('banner').innerHTML = t ? '<div class="banner">' + esc(t) + '</div>' : ''; };
  let toastT;
  const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2400); };
  const col = () => db.collection('commandes');

  // Bouton à deux clics : le premier arme, le second confirme.
  function armed(btn, label, armLabel) {
    if (btn.classList.contains('arm')) { clearTimeout(btn._t); btn.classList.remove('arm'); btn.textContent = label; return true; }
    btn.classList.add('arm'); btn.textContent = armLabel;
    btn._t = setTimeout(() => { btn.classList.remove('arm'); btn.textContent = label; }, 3500);
    return false;
  }

  /* ---------- Affichage ---------- */
  const ICON_EDIT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  const ICON_X = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  function renderChips() {
    const present = new Set(items.map(famOf));
    const list = [['all', 'Tous']].concat(FAM_ORDER.filter(f => present.has(f)).map(f => [f, FAM_LABEL[f]]));
    if (fam !== 'all' && !present.has(fam)) fam = 'all';
    $('chips').innerHTML = list.map(([k, l]) => '<button type="button" class="chip' + (k === fam ? ' on' : '') + '" data-fam="' + esc(k) + '" aria-pressed="' + (k === fam) + '">' + esc(l) + '</button>').join('');
  }

  function renderCatalogue() {
    $('cat-count').textContent = items.length + ' référence' + (items.length > 1 ? 's' : '');
    const t = norm(term.trim());
    const l = items.filter(i => (fam === 'all' || famOf(i) === fam) && (!t || [i.name, i.reference, i.device].some(v => norm(v).includes(t)))).sort(byFam);
    if (!loaded) return;
    if (!l.length) {
      $('cat-list').innerHTML = '<div class="empty">' + (items.length ? 'Aucune pièce ne correspond à cette recherche.' : 'Le catalogue est vide. Ajoutez une pièce avec « + Nouvelle pièce ».') + '</div>';
      return;
    }
    let last = null;
    $('cat-list').innerHTML = l.map(i => {
      const g = FAM_LABEL[famOf(i)] + ' · ' + (i.device || 'Sans appareil');
      const h = g !== last ? '<h3 class="grp">' + esc(g) + '</h3>' : '';
      last = g;
      return h + '<div class="item" data-id="' + esc(i.id) + '"><div class="item-main"><div class="item-name">' + esc(i.name) + '</div>' +
        (i.reference ? '<div class="mono item-ref">' + esc(i.reference) + '</div>' : '') +
        (i.note ? '<div class="item-note">' + esc(i.note) + '</div>' : '') + '</div>' +
        (i.device ? '<span class="dev">' + esc(i.device) + '</span>' : '') +
        '<button type="button" class="rowbtn" data-act="edit" aria-label="Modifier ' + esc(i.name) + '" ' + ro() + '>' + ICON_EDIT + '</button>' +
        (inCmd(i)
          ? '<button type="button" class="btn sm added" data-act="remove" title="Retirer de la commande" ' + ro() + '>Dans la commande</button>'
          : '<button type="button" class="btn sm" data-act="add" ' + ro() + '>+ Ajouter</button>') +
        '</div>';
    }).join('');
  }

  function cmdItems() {
    return items.filter(inCmd).sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0) || byFam(a, b));
  }

  function renderCommande() {
    const l = cmdItems(), u = l.filter(i => i.urgent).length;
    $('cmd-count').textContent = l.length ? l.length + ' pièce' + (l.length > 1 ? 's' : '') + (u ? ' · ' + u + ' urgente' + (u > 1 ? 's' : '') : '') : '';
    $('pdf').disabled = !l.length;
    $('clear').disabled = !l.length || !!ro();
    if (!loaded) { $('cmd-list').innerHTML = '<div class="skeleton">Chargement…</div>'; return; }
    if (!l.length) { $('cmd-list').innerHTML = '<div class="empty">Aucune pièce dans la commande.<br>Ajoutez-en depuis le catalogue.</div>'; return; }
    $('cmd-list').innerHTML = l.map((i, n) =>
      '<div class="item" data-id="' + esc(i.id) + '"' + (n ? '' : ' style="border-top:0"') + '><div class="item-main"><div class="item-name">' + esc(i.name) + '</div>' +
      (i.reference ? '<div class="mono item-ref">' + esc(i.reference) + (i.device ? ' · ' + esc(i.device) : '') + '</div>' : (i.device ? '<div class="item-ref" style="font-size:12px">' + esc(i.device) + '</div>' : '')) + '</div>' +
      '<button type="button" class="urg' + (i.urgent ? ' on' : '') + '" data-act="urgent" aria-pressed="' + !!i.urgent + '" ' + ro() + '>Urgent</button>' +
      '<div class="qty"><button type="button" data-act="dec" aria-label="Diminuer la quantité de ' + esc(i.name) + '" ' + ro() + '>−</button><span aria-label="Quantité">' + (i.quantity || 1) + '</span><button type="button" data-act="inc" aria-label="Augmenter la quantité de ' + esc(i.name) + '" ' + ro() + '>+</button></div>' +
      '<button type="button" class="rowbtn" data-act="remove" aria-label="Retirer ' + esc(i.name) + ' de la commande" ' + ro() + '>' + ICON_X + '</button></div>'
    ).join('');
  }

  function render() { renderChips(); renderCatalogue(); renderCommande(); }

  /* ---------- Écritures ---------- */
  async function upd(i, data, msg) {
    if (!db || canWrite === false) return;
    const prev = {}; Object.keys(data).forEach(k => prev[k] = i[k]);
    Object.assign(i, data); render();
    try { await col().doc(i.id).update(data); if (msg) toast(msg); }
    catch (e) { Object.assign(i, prev); render(); banner('La modification n’a pas pu être enregistrée. Réessayez.'); }
  }

  function onListClick(e) {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const row = b.closest('[data-id]'); const i = row && items.find(x => x.id === row.getAttribute('data-id')); if (!i) return;
    const a = b.getAttribute('data-act');
    if (a === 'add') upd(i, { status: 'a_commander', quantity: 1, urgent: false }, 'Pièce ajoutée à la commande.');
    else if (a === 'remove') upd(i, { status: 'catalogue', quantity: 1, urgent: false }, 'Pièce retirée de la commande.');
    else if (a === 'urgent') upd(i, { urgent: !i.urgent });
    else if (a === 'inc') upd(i, { quantity: Math.min(9999, (i.quantity || 1) + 1) });
    else if (a === 'dec') upd(i, { quantity: Math.max(1, (i.quantity || 1) - 1) });
    else if (a === 'edit') sheet(i);
  }
  $('cat-list').addEventListener('click', onListClick);
  $('cmd-list').addEventListener('click', onListClick);
  $('chips').addEventListener('click', e => { const c = e.target.closest('[data-fam]'); if (c) { fam = c.getAttribute('data-fam'); render(); } });
  $('search').addEventListener('input', e => { term = e.target.value; renderCatalogue(); });
  $('new-piece').addEventListener('click', () => sheet());
  $('pdf').addEventListener('click', pdf);
  $('clear').addEventListener('click', async () => {
    const btn = $('clear');
    if (!armed(btn, 'Vider la commande', 'Confirmer : tout retirer ?')) return;
    const l = items.filter(inCmd), data = { status: 'catalogue', quantity: 1, urgent: false };
    btn.disabled = true; btn.textContent = 'Suppression…';
    let fail = 0;
    for (const i of l) { try { await col().doc(i.id).update(data); Object.assign(i, data); } catch (e) { fail++; } }
    btn.textContent = 'Vider la commande';
    render();
    if (fail) banner(fail + ' pièce(s) n’ont pas pu être retirées. Réessayez.'); else toast('Commande vidée.');
  });

  /* ---------- Fenêtre pièce ---------- */
  function sheet(it) {
    const o = document.createElement('div'); o.className = 'overlay';
    const devOpts = '<option value="">—</option>' + DEVICES.map(d => '<option' + (it && it.device === d ? ' selected' : '') + '>' + esc(d) + '</option>').join('');
    o.innerHTML = '<form class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">' + (it ? 'Modifier la pièce' : 'Nouvelle pièce') + '</h2>' +
      '<div class="fld"><label for="f-name">Désignation</label><input id="f-name" required maxlength="200" value="' + esc(it ? it.name : '') + '"></div>' +
      '<div class="grid2"><div class="fld"><label for="f-ref">Référence</label><input id="f-ref" maxlength="80" value="' + esc(it ? it.reference : '') + '"></div>' +
      '<div class="fld"><label for="f-dev">Appareil</label><select id="f-dev">' + devOpts + '</select></div></div>' +
      '<div class="fld"><label for="f-note">Note</label><textarea id="f-note" maxlength="1000">' + esc(it ? it.note : '') + '</textarea></div>' +
      '<p class="err" id="f-err"></p>' +
      '<div class="mfoot">' + (it ? '<button type="button" class="btn danger left" id="f-del">Supprimer</button>' : '') +
      '<button type="button" class="btn" id="f-cancel">Annuler</button><button type="submit" class="btn primary" id="f-save">' + (it ? 'Enregistrer' : 'Ajouter au catalogue') + '</button></div></form>';
    document.body.appendChild(o);
    const q = s => o.querySelector(s), close = () => { o.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    o.addEventListener('mousedown', e => { if (e.target === o) close(); });
    q('#f-cancel').addEventListener('click', close);
    setTimeout(() => q('#f-name').focus(), 30);
    const del = q('#f-del');
    if (del) del.addEventListener('click', async () => {
      if (!armed(del, 'Supprimer', 'Confirmer la suppression')) return;
      del.disabled = true;
      try { await col().doc(it.id).delete(); close(); toast('Pièce supprimée du catalogue.'); }
      catch (e) { del.disabled = false; q('#f-err').textContent = 'La suppression a échoué. Réessayez.'; }
    });
    q('form').addEventListener('submit', async e => {
      e.preventDefault();
      const name = q('#f-name').value.trim();
      if (!name) { q('#f-name').focus(); return; }
      const data = { name, reference: q('#f-ref').value.trim(), device: q('#f-dev').value, note: q('#f-note').value.trim() };
      const s = q('#f-save'); s.disabled = true;
      try {
        if (!db) throw new Error('db');
        if (it) await col().doc(it.id).update(data);
        else await col().add(Object.assign(data, { quantity: 1, status: 'catalogue', urgent: false }));
        close(); toast(it ? 'Pièce mise à jour.' : 'Pièce ajoutée au catalogue.');
      } catch (x) { s.disabled = false; q('#f-err').textContent = 'L’enregistrement a échoué. Réessayez.'; }
    });
  }

  /* ---------- PDF ---------- */
  async function pdf() {
    if (!window.jspdf) { banner('Le PDF n’est pas disponible pour le moment. Rechargez la page.'); return; }
    const l = cmdItems().sort(byFam);
    if (!l.length) return;
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const P = [51, 50, 90], W = 210, H = 297;
    const fit = (t, w) => { t = String(t || ''); while (t.length > 1 && doc.getTextWidth(t) > w) t = t.slice(0, -1); return t; };
    doc.setFillColor(...P); doc.rect(0, 0, W, 30, 'F');
    doc.setFillColor(255, 255, 255); doc.rect(0, 0, 70, 30, 'F'); doc.triangle(70, 0, 80, 0, 70, 30, 'F');
    try { doc.addImage(LOGO, 'JPEG', 10, 6.5, 55, 17.1); } catch (e) {}
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
    doc.text('Bon de commande — consommables', 86, 15);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    const u = l.filter(i => i.urgent).length;
    doc.text(l.length + ' ligne(s)' + (u ? ' · ' + u + ' urgente(s)' : '') + ' · ' + new Date().toLocaleDateString('fr-FR'), 86, 22);
    let y = 40;
    const head = () => {
      doc.setFillColor(220, 241, 251); doc.rect(14, y - 5.5, W - 28, 8, 'F');
      doc.setTextColor(...P); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
      [['Consommable', 16], ['Référence', 80], ['Appareil', 122], ['Qté', 150], ['Priorité', 164]].forEach(([t, x]) => doc.text(t, x, y));
      y += 9;
    };
    head();
    let lastFam = null;
    l.forEach((i, n) => {
      const f = famOf(i);
      if (f !== lastFam) {
        if (y > H - 40) { doc.addPage(); y = 20; head(); }
        y += 3;
        doc.setFillColor(...P); doc.rect(14, y - 5.5, W - 28, 8, 'F');
        doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
        const devs = [...new Set(l.filter(x => famOf(x) === f).map(x => x.device || 'Sans appareil'))].join(' / ');
        doc.text(fit(f + '  —  ' + devs, W - 32), 16, y);
        y += 10; lastFam = f;
      }
      if (y > H - 22) { doc.addPage(); y = 20; head(); }
      doc.setFont('helvetica', i.urgent ? 'bold' : 'normal'); doc.setFontSize(10);
      const nl = doc.splitTextToSize(i.name, 62).slice(0, 2), rh = nl.length > 1 ? 12 : 8;
      if (n % 2) { doc.setFillColor(247, 247, 250); doc.rect(14, y - 5.2, W - 28, rh, 'F'); }
      doc.setTextColor(...(i.urgent ? [148, 44, 36] : [30, 30, 30]));
      doc.text(nl, 16, y);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 30, 30);
      { let fs = 10; const r = i.reference || '-'; doc.setFontSize(fs); while (fs > 5 && doc.getTextWidth(r) > 40) { fs -= 0.5; doc.setFontSize(fs); } doc.text(r, 80, y); doc.setFontSize(10); }
      doc.text(fit(i.device || '-', 26), 122, y);
      doc.setFont('helvetica', 'bold'); doc.text(String(i.quantity || 1), 150, y);
      if (i.urgent) { doc.setTextColor(148, 44, 36); doc.text('URGENT', 164, y); doc.setTextColor(30, 30, 30); }
      else { doc.setFont('helvetica', 'normal'); doc.text('Normale', 164, y); }
      y += rh;
    });
    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p); doc.setDrawColor(215, 218, 232); doc.line(14, H - 14, W - 14, H - 14);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(111, 111, 148);
      doc.text('Atelier Fabien — commandes de consommables', 14, H - 9);
      doc.text('Page ' + p + '/' + pages, W - 14, H - 9, { align: 'right' });
    }
    const fname = 'commande_consommables_' + new Date().toISOString().slice(0, 10) + '.pdf';
    if (!dl) { try { doc.save(fname); } catch (e) { banner('Le PDF n’a pas pu être téléchargé.'); } return; }
    try { await dl.save({ filename: fname, data: doc.output('blob') }); }
    catch (e) { if (!e || e.code !== 'declined') banner('Le PDF n’a pas pu être téléchargé.'); }
  }

  /* ---------- Firebase (hors de claude.ai) ---------- */
  const FB_VER = '10.12.2';
  const loadScript = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
  async function firebaseDb(cfg) {
    if (!window.firebase || !window.firebase.firestore) {
      await loadScript('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-firestore-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-auth-compat.js');
    }
    if (!window.firebase.apps.length) window.firebase.initializeApp(cfg);
    const auth = window.firebase.auth();
    const user = await new Promise(ok => { const off = auth.onAuthStateChanged(u => { off(); ok(u); }); });
    if (!user) await askPassword(auth);
    const lo = $('logout'); lo.hidden = false; lo.onclick = () => auth.signOut().then(() => location.reload());
    return window.firebase.firestore();
  }

  // Écran d'accès : un seul mot de passe partagé par l'équipe (compte FIREBASE_LOGIN_EMAIL).
  function askPassword(auth) {
    const email = window.FIREBASE_LOGIN_EMAIL || 'equipe@consommables-e2efa.app';
    return new Promise(done => {
      const o = document.createElement('div'); o.className = 'overlay login';
      o.innerHTML = '<form class="modal" role="dialog" aria-modal="true" aria-labelledby="l-title">' +
        '<div style="text-align:center;margin-bottom:16px"><img src="logo.png" alt="KITVIA" style="height:52px;width:auto">' +
        '<h2 id="l-title" style="margin:10px 0 0;font-size:17px">Commande consommables</h2></div>' +
        '<div class="fld"><label for="pwd">Mot de passe de l’équipe</label><input id="pwd" type="password" autocomplete="current-password" required></div>' +
        '<p class="err" id="pwd-err"></p>' +
        '<div class="mfoot"><button class="btn primary" type="submit" style="width:100%">Entrer</button></div></form>';
      document.body.appendChild(o);
      const i = o.querySelector('#pwd'), err = o.querySelector('#pwd-err'), go = o.querySelector('button');
      setTimeout(() => i.focus(), 50);
      o.querySelector('form').addEventListener('submit', async e => {
        e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Vérification…';
        try { await auth.signInWithEmailAndPassword(email, i.value); o.remove(); done(); }
        catch (x) {
          const c = x && x.code || '';
          err.textContent = c.includes('too-many-requests') ? 'Trop d’essais. Patientez quelques minutes.' :
            (c.includes('network') ? 'Pas de connexion internet.' : 'Mot de passe incorrect.');
          go.disabled = false; go.textContent = 'Entrer'; i.select();
        }
      });
    });
  }

  /* ---------- Démarrage ---------- */
  async function boot() {
    let framed = true; try { framed = window.self !== window.top; } catch (e) {}
    const cfg = window.FIREBASE_CONFIG;
    // Dans claude.ai (page encadrée), on attend la plateforme ; sur Firebase, on passe directement.
    if (framed || !cfg) for (let k = 0; k < 30 && !(window.claude && typeof window.claude.use === 'function'); k++) await new Promise(r => setTimeout(r, 100));
    const use = n => (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null);
    dl = await use('downloads');
    db = await use('db');
    if (!db && cfg) { try { db = await firebaseDb(cfg); } catch (e) { db = null; } }
    if (!db) {
      loaded = true; $('status').textContent = 'Hors ligne';
      banner(cfg ? 'Impossible de se connecter à la base Firebase. Vérifiez votre connexion puis rechargez la page.' : 'La liste partagée n’est pas disponible : Firebase n’est pas encore configuré (fichier firebase-config.js).');
      render(); return;
    }
    try { const u = await use('user'); if (u) canWrite = await u.can('data.write'); } catch (e) { canWrite = null; }
    const tmo = setTimeout(() => { if (!loaded) { loaded = true; banner('La liste met du temps à charger. Vérifiez votre connexion.'); render(); } }, 10000);
    try {
      col().orderBy('name').onSnapshot(
        s => {
          clearTimeout(tmo);
          banner(canWrite === false ? 'Vous êtes en lecture seule sur cette liste.' : '');
          items = s.docs.map(d => ({ id: d.id, ...d.data() }));
          loaded = true; $('status').textContent = 'Connecté · à jour'; render();
        },
        () => { clearTimeout(tmo); loaded = true; $('status').textContent = 'Déconnecté'; banner('La connexion à la liste a été interrompue. Rechargez la page.'); render(); });
    } catch (e) { loaded = true; banner('Impossible de charger la liste.'); render(); }
  }
  render();
  boot();
})();
</script>
</body>
</html>
